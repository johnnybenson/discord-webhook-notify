name: Test Action
on: [ push ]
env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
jobs:
  windows_test:
    runs-on: windows-latest
    name: Windows Test Job
    steps:
    - name: Skip tests without webhook
      if: ${{ env.DISCORD_WEBHOOK == '' }}
      run: echo "DISCORD_WEBHOOK secret is not set; skipping Discord notification tests."
    - name: Windows Test Info
      if: ${{ env.DISCORD_WEBHOOK != '' }}
      uses: johnnybenson/discord-webhook-notify@v1.1.5
      with:
        severity: info
        details: Test succeeded.
        webhookUrl: ${{ env.DISCORD_WEBHOOK }}
    - name: Windows Test Warn
      if: ${{ env.DISCORD_WEBHOOK != '' }}
      uses: johnnybenson/discord-webhook-notify@v1.1.5
      with:
        severity: warn
        details: Test warning.
        webhookUrl: ${{ env.DISCORD_WEBHOOK }}
    - name: Windows Test Error
      if: ${{ env.DISCORD_WEBHOOK != '' }}
      uses: johnnybenson/discord-webhook-notify@v1.1.5
      with:
        severity: error
        details: Test error.
        webhookUrl: ${{ env.DISCORD_WEBHOOK }}
    - name: Windows Test Custom
      if: ${{ env.DISCORD_WEBHOOK != '' }}
      uses: johnnybenson/discord-webhook-notify@v1.1.5
      with:
        severity: info
        username: CustomUsername
        color: '#ff00aa'
        avatarUrl: https://github.githubassets.com/images/modules/logos_page/Octocat.png
        description: This is a custom description.
        details: 'Custom details: Somebody set up us the bomb.'
        footer: This is a footer.
        text: This is where text goes.
        webhookUrl: ${{ env.DISCORD_WEBHOOK }}
    - name: Windows Test Success
      uses: johnnybenson/discord-webhook-notify@v1.1.5
      if: ${{ env.DISCORD_WEBHOOK != '' && success() }}
      with:
        severity: info
        webhookUrl: ${{ env.DISCORD_WEBHOOK }}
    - name: Windows Test Failure
      uses: johnnybenson/discord-webhook-notify@v1.1.5
      if: ${{ env.DISCORD_WEBHOOK != '' && failure() }}
      with:
        severity: error
        webhookUrl: ${{ env.DISCORD_WEBHOOK }}
    - name: Windows Test Cancelled
      uses: johnnybenson/discord-webhook-notify@v1.1.5
      if: ${{ env.DISCORD_WEBHOOK != '' && cancelled() }}
      with:
        severity: warn
        webhookUrl: ${{ env.DISCORD_WEBHOOK }}
